openapi: 3.0.0
info:
  title: ELECQ Open Access
  version: 1.0.0
  description: >

    ## Authorization Code Flow


    This flow follows the OAuth 2.0 standard. Your application guides the user
    through login and consent in the browser, then exchanges the authorization
    code for an access token.


    Integration Domain

    - API Endpoint: https://api.elecq.com


    ### Step 1: Initiate Authorization Request

    - Endpoint: `GET /api/v1/oauth2/authorize`

    - Query parameters:
      - `response_type=code`
      - `client_id=<issued client_id>`
      - `redirect_uri=<pre-registered callback URL>`
      - `scope=<requested scopes, e.g., openid device.read device.write device.execute>`
      - `state=<recommended random string>`
    - Behavior: The user is redirected to the login and consent pages. After
    consent, the browser redirects to your redirect_uri carrying a code and the
    original state.

    Example (browser address bar):


    ```text

    https://api.elecq.com/api/v1/oauth2/authorize?response_type=code&client_id=merchant-client&redirect_uri=https%3A%2F%2Fapi.elecq.com%2Fapi%2Fv1%2Foauth2%2Fauthorized-callback&scope=openid%20device.read%20device.write&state=xyz123

    ```


    ### Step 2: Exchange Code for Tokens

    - Endpoint: `POST /api/v1/oauth2/token`

    - Header: `Authorization: Basic <base64(client_id:client_secret)>`

    - Content-Type: `application/x-www-form-urlencoded`

    - Body parameters:
      - `grant_type=authorization_code`
      - `code=<authorization code from Step 1>`
      - `redirect_uri=<same as Step 1>`
    - Success: `200 OK` with access_token (JWT) and possibly refresh_token.

    Example (cURL):


    ```bash

    curl -X POST https://api.elecq.com/api/v1/oauth2/token \
      -H "Authorization: Basic $(printf '%s' 'client_id:secret' | base64)" \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -d "grant_type=authorization_code" \
      -d "code=AUTH_CODE_FROM_CALLBACK" \
      -d "redirect_uri=https%3A%2F%2Fyour-app.example%2Foauth%2Fcallback"
    ```


    ### Refresh Token (grant_type=refresh_token)

    - Use a refresh token to obtain a new access token without re-authenticating
    the user.

    - Endpoint: `POST /api/v1/oauth2/token`

    - Auth: `Authorization: Basic <base64(client_id:client_secret)>`

    - Content-Type: `application/x-www-form-urlencoded`

    - Body:
      - `grant_type=refresh_token`
      - `refresh_token=<previously issued refresh_token>`
    - Success: `200 OK` with a new access_token (JWT) and possibly a rotated
    refresh_token.

    Example (cURL):


    ```bash

    curl -X POST https://api.elecq.com/api/v1/oauth2/token \
      -H "Authorization: Basic $(printf '%s' 'CLIENT_ID:CLIENT_SECRET' | base64)" \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -d "grant_type=refresh_token" \
      -d "refresh_token=YOUR_REFRESH_TOKEN"
    ```


    **When to use:**

    - Current access_token is near expiry (check exp) and you want to refresh
    proactively.

    - `/api/v1/access/**` returns `401 Unauthorized` due to an expired/invalid
    access_token.

    - Long-lived server-to-server sessions needing continuity without user
    action.


    **Handling & security:**

    - Store `refresh_token` only on backend; never expose to browsers/mobile.

    - If a new refresh_token is returned, rotate and discard the old one.

    - On `400 invalid_grant` for refresh, restart the full authorization flow
    (Step 1).

    - On `401 invalid_client`, verify client_id/client_secret.


    **Validate Token (Optional)**

    - JWK Set endpoint: `GET /api/v1/oauth2/jwks`

    - Recommended to fetch the public keys on your server to verify the token
    signature and standard claims `(iss/aud/exp)`.

    - Note: The `aud (Audience)` should include your registered client
    identifier; otherwise, resource APIs may reject access.


    **Using access_token to Call** `/api/v1/access/**`

    - All requests must include header: `Authorization: Bearer <access_token>`

    - The resource server validates tokens automatically via JWK; invalid tokens
    or insufficient permissions yield appropriate status codes.


    ## API Overview


    0)


    1) Connectivity Test

    - GET `/api/v1/access/hello`

    - Success: `200 OK`, response body: "Hello"

    - Example:


    ```bash

    curl -H "Authorization: Bearer YOUR_ACCESS_TOKEN" \
      https://api.elecq.com/api/v1/access/hello
    ```


    2) List User Devices

    - GET `/api/v1/access/user/devices`

    - Success: `200 OK`

    - Sample response:


    ```json

    [
      {
        "deviceId": "text",
        "deviceName": "text",
        "productModel": "text",
        "maxChargeRateInKilowatts": 7.2
      }
    ]

    ```


    - Example:


    ```bash

    curl -H "Authorization: Bearer YOUR_ACCESS_TOKEN" \
      https://api.elecq.com/api/v1/access/user/devices
    ```


    **More APIs are available in the Api Collection.**


    ---


    ## Error and Status Code Conventions

    - Invalid/expired/used authorization code: `400 Bad Request`,
    error=invalid_grant

    - Client authentication failure (client_id/client_secret missing or wrong):
    `401 Unauthorized`, error=invalid_client

    - Audience mismatch or insufficient permissions: `403 Forbidden`

    - Method not allowed: `405 Method Not Allowed`

    - Other validation/binding errors on resource APIs return structured codes
    and messages accordingly.


    ---


    ## Client Configuration Notes

    - Client authentication method: client_secret_basic (recommended)

    - redirect_uri must be pre-registered and be an absolute URL; it must match
    between authorization and token exchange.

    - If you need OIDC user info, include scopes like openid, profile.

    - Keep your client secret secure; do not expose it in frontend or publicly
    accessible environments.
servers:
  - url: https://api.elecq.com
paths:
  /api/v1/oauth2/token:
    post:
      summary: Obtain / Refresh Tokens
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              oneOf:
                - title: Authorization Code Exchange
                  type: object
                  required:
                    - grant_type
                    - code
                    - redirect_uri
                  properties:
                    grant_type:
                      type: string
                      enum:
                        - authorization_code
                      description: >-
                        Use authorization_code to exchange an authorization code
                        for tokens.
                    code:
                      type: string
                      description: >-
                        Authorization code returned to your redirect URI after
                        the user grants consent.
                    redirect_uri:
                      type: string
                      format: uri
                      description: >-
                        Must match the redirect URI registered for your client
                        and used in the authorization request.
                - title: Refresh Token
                  type: object
                  required:
                    - grant_type
                    - refresh_token
                  properties:
                    grant_type:
                      type: string
                      enum:
                        - refresh_token
                      description: >-
                        Use refresh_token to obtain a new access token with an
                        existing refresh token.
                    refresh_token:
                      type: string
                      description: >-
                        Refresh token previously issued to this client. If a
                        previous refresh returned a replacement, use the latest
                        token.
            examples:
              authorization_code:
                summary: Exchange an authorization code
                description: >-
                  Replace the code and redirect URI with the values from your
                  authorization flow.
                value:
                  grant_type: authorization_code
                  code: AUTH_CODE_FROM_CALLBACK
                  redirect_uri: https://your-app.example/oauth/callback
              refresh_token:
                summary: Refresh an access token
                description: >-
                  Replace the refresh token with the latest token issued to your
                  client.
                value:
                  grant_type: refresh_token
                  refresh_token: YOUR_REFRESH_TOKEN
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    format: style
                  refresh_token:
                    type: string
                  scope:
                    type: string
                  id_token:
                    type: string
                    format: style
                  token_type:
                    type: string
                  expires_in:
                    type: integer
              example:
                access_token: '{{vault:json-web-token}}'
                refresh_token: >-
                  6-uThiDjJEG7Czw7a5HzWpxc50Tg3CMnxEEKHuLN-dm9XydTUHEqYg_WPaQRvN72SIAYZ0SFNNRu9IE53E8NxVXFTYzG8wIh3FsuC7kodUyEKChYz8N8UPhxODDQ5XIa
                scope: openid
                id_token: '{{vault:json-web-token}}'
                token_type: Bearer
                expires_in: 86399
        '400':
          description: Fail
      tags:
        - OAuth2 Integration
      security:
        - BasicAuth: []
      description: >
        Exchange an authorization code for tokens, or use a refresh token to
        obtain a new access token.


        Both flows use `POST https://api.elecq.com/api/v1/oauth2/token` with

        `Content-Type: application/x-www-form-urlencoded`.

        Authenticate using HTTP Basic authentication: use your `client_id` as
        the

        username and your `client_secret` as the password. This produces the
        header

        `Authorization: Basic <base64(client_id:client_secret)>`.


        ### Authorization Code Exchange


        After the user completes authorization at `/api/v1/oauth2/authorize`,

        submit the following form fields:


        - `grant_type`: `authorization_code`.

        - `code`: the authorization code received by your callback.

        - `redirect_uri`: the same registered redirect URI used in the
        authorization request.


        A successful response contains an `access_token` and may include a

        `refresh_token`. Use the access token as a Bearer token when calling

        `/api/v1/access/**`, and store the refresh token for later use if one is
        returned.


        ### Refresh Token


        To obtain a new access token without asking the user to authorize again,

        submit the following form fields to this same endpoint:


        - `grant_type`: `refresh_token`.

        - `refresh_token`: the latest refresh token issued to your client.


        The authorization code and redirect URI are not required for this flow.

        On success, use the new `access_token`. If the response includes a new

        `refresh_token`, replace the stored refresh token with it; otherwise,

        continue using the existing refresh token.


        If refreshing fails with `400 invalid_grant`, restart the authorization

        code flow. For `401 invalid_client`, verify your client credentials.
  /api/v1/access/hello:
    get:
      summary: Hello Test
      responses:
        '200':
          description: Success
        '400':
          description: Fail
      tags:
        - API Collection
      security:
        - BearerAuth: []
      description: >-
        Test endpoint to verify API connectivity and authentication. Returns a
        simple response to confirm that your API credentials are valid and the
        service is accessible. Use this endpoint to validate your integration
        setup before making other API calls.
  /api/v1/access/user/devices:
    get:
      summary: List Devices
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              example:
                message: success
                code: '000000'
                devices:
                  - deviceId: AU001ABC000010
                    model: AU001
                    maxChargeRateInKilowatts: 7
        '500':
          description: Fail
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string
                    format: color
                  devices:
                    nullable: true
              example:
                message: server error
                code: '101994'
                data: null
      tags:
        - API Collection
      security:
        - BearerAuth: []
      description: >-
        Retrieve a list of all EV charging devices associated with your account.
        This endpoint returns device information including device IDs, status,
        location, and capabilities. Use this to discover available devices
        before performing operations like starting or stopping charging
        sessions.
  /api/v1/access/user/device/{deviceId}:
    get:
      summary: Device‘s Details
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              example:
                message: success
                code: '000000'
                data:
                  deviceId: AU001ABC000010
                  deviceName: My Charger
                  model: AU001
                  productName: Elecq Home H1
                  maxChargeRateInKilowatts: 7
                  evseInfo:
                    - evseId: '0'
                      state: Init
                    - evseId: '1'
                      state: Available
                  networkStatus: 1
                  stationId: '12345'
                  runningStatus: 1
                  activateStatus: 1
                  firstActivateAt: 1763386209000
                  firstBoundTime: 1763386209000
                  firmwareVersion: V1.2.1(2-1763386209)
        '500':
          description: Fail
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string
                    format: color
                  data:
                    nullable: true
              example:
                message: server error
                code: '101994'
                data: null
      tags:
        - API Collection
      security:
        - BearerAuth: []
      description: >-
        Retrieve detailed information about a specific EV charging device. This
        endpoint provides comprehensive device data including current status,
        charging capabilities, power output, connectivity information, and
        real-time metrics. Requires a valid device ID obtained from the List
        Devices endpoint.
  /api/v1/access/charge/start:
    post:
      summary: Start Charge
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              example:
                message: success
                code: '000000'
                data:
                  idToken: b50f6a376e92b6629bec97730b099370
        '500':
          description: Fail
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string
                    format: color
                  data:
                    nullable: true
              example:
                message: server error
                code: '101994'
                data: null
      tags:
        - API Collection
      security:
        - BearerAuth: []
      description: >-
        Initiate a charging session for a specific EV charging device. This
        endpoint starts the charging process and returns session details
        including the session ID, start time, and initial status. Requires a
        valid device ID and ensures the device is available and ready to charge.
        Use the session ID to monitor or stop the charging session.
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              deviceId: ABCD
              evseId: 1
  /api/v1/access/charge/stop:
    post:
      summary: Stop Charge
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              example:
                message: success
                code: '000000'
                data:
                  idToken: b50f6a376e92b6629bec97730b099370
        '500':
          description: Fail
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string
                    format: color
                  data:
                    nullable: true
              example:
                message: server error
                code: '101994'
                data: null
      tags:
        - API Collection
      security:
        - BearerAuth: []
      description: >-
        Terminate an active charging session for a specific EV charging device.
        This endpoint stops the charging process and returns final session
        details including total energy delivered, duration, and end time.
        Requires a valid session ID from an active charging session. The device
        will be released and made available for new charging sessions.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                evseId:
                  type: integer
            example:
              deviceId: abcd1234
              evseId: 1
  /api/v1/access/register-device:
    post:
      summary: Register Device Credentials
      parameters:
        - name: deviceId
          in: query
          description: Device ID
          schema:
            type: string
          example: <deviceId>
      responses:
        '204':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    format: color
                  message:
                    type: string
                  data:
                    nullable: true
              example:
                code: '101994'
                message: server error
                data: null
      tags:
        - API Collection
      security:
        - BearerAuth: []
      description: >-
        Register and configure OCPP server credentials for a specific EV
        charging device. This endpoint allows you to onboard a device by
        providing the OCPP server URL, username, and password. Once registered,
        the device can establish secure communication with the charging
        infrastructure. Requires a valid device ID as a query parameter.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                serverUrl:
                  type: string
                username:
                  type: string
                password:
                  type: string
            example:
              serverUrl: OCPP Server Endpoint
              username: username1
              password: xyz123
  /api/v1/access/offboard-device:
    delete:
      summary: Offboard Device Credentials
      parameters:
        - name: deviceId
          in: query
          description: Device ID
          schema:
            type: string
          example: <deviceId>
      responses:
        '204':
          description: Success
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    format: color
                  message:
                    type: string
                  data:
                    nullable: true
              example:
                code: '101994'
                message: server error
                data: null
      tags:
        - API Collection
      security:
        - BearerAuth: []
      description: >-
        Remove OCPP server credentials and deregister a specific EV charging
        device from your account. This endpoint securely deletes the stored
        server URL, username, and password, effectively disconnecting the device
        from the charging infrastructure. Use this when decommissioning a device
        or transferring it to another account. Requires a valid device ID as a
        query parameter.
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    BearerAuth:
      type: http
      scheme: bearer
security:
  - BasicAuth: []
